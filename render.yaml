services:
  - type: web
    name: bg-remover-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # free = 512MB. onnxruntime peaks ~1GB → /remove OOMs on free.
    # Stay free until revenue; upgrade to standard (2GB) then.
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PROXY_SECRET
        generateValue: true
