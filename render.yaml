services:
  - type: web
    name: bg-remover-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard   # 2GB RAM — required: onnxruntime-node peaks ~1GB. free(512MB)/starter(512MB) OOM.
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PROXY_SECRET
        generateValue: true   # Render generates a random secret; copy it into RapidAPI proxy header
