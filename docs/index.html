<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BG Remover — free, private, in-browser</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#5a5a5a; --paper:#f6f3ee; --line:#d9d2c5; --accent:#0b6e4f; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif; background:
      radial-gradient(900px 400px at 10% -10%, #e7efe9, transparent),
      radial-gradient(700px 300px at 100% 0%, #efe8dc, transparent),
      var(--paper); color:var(--ink); min-height:100vh; }
    main { max-width:880px; margin:0 auto; padding:48px 20px 80px; }
    h1 { font-size:clamp(2rem,5vw,3.2rem); letter-spacing:-0.03em; margin:0 0 8px; }
    .sub { color:var(--muted); max-width:42rem; line-height:1.5; margin:0 0 28px; }
    .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:20px; }
    button, label.file {
      appearance:none; border:1px solid var(--ink); background:var(--ink); color:#fff;
      padding:12px 18px; font:inherit; cursor:pointer; border-radius:0;
    }
    button.secondary { background:transparent; color:var(--ink); }
    button:disabled { opacity:0.45; cursor:not-allowed; }
    label.file input { display:none; }
    .stage { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:700px){ .stage { grid-template-columns:1fr; } }
    figure { margin:0; border:1px solid var(--line); background:
      linear-gradient(45deg,#ddd 25%,transparent 25%),
      linear-gradient(-45deg,#ddd 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#ddd 75%),
      linear-gradient(-45deg,transparent 75%,#ddd 75%);
      background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; background-color:#fff;
      min-height:240px; display:flex; align-items:center; justify-content:center; }
    figure img { max-width:100%; max-height:420px; display:block; }
    figcaption { font-size:0.85rem; color:var(--muted); margin-top:8px; }
    #status { min-height:1.4em; color:var(--accent); font-variant-numeric:tabular-nums; }
    footer { margin-top:36px; color:var(--muted); font-size:0.9rem; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>BG Remover</h1>
    <p class="sub">Cut the shadow, keep the ghost. Runs <strong>entirely in your browser</strong> — image never leaves your device. Free forever for this demo. API for apps ships when the paid host is funded.</p>

    <div class="row">
      <label class="file">Choose image<input id="file" type="file" accept="image/*" /></label>
      <button id="run" class="secondary" disabled>Remove background</button>
      <a id="dl" hidden><button type="button">Download PNG</button></a>
    </div>
    <p id="status"></p>

    <div class="stage">
      <div>
        <figure><img id="src" alt="Original preview" /></figure>
        <figcaption>Original</figcaption>
      </div>
      <div>
        <figure><img id="out" alt="Result preview" /></figure>
        <figcaption>No background</figcaption>
      </div>
    </div>

    <footer>
      Powered by <a href="https://github.com/imgly/background-removal-js" target="_blank" rel="noreferrer">@imgly/background-removal</a>
      · Source <a href="https://github.com/vitou-vitou/bg-remover-api" target="_blank" rel="noreferrer">bg-remover-api</a>
    </footer>
  </main>

  <script type="module">
    import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";

    const fileEl = document.getElementById("file");
    const runBtn = document.getElementById("run");
    const srcImg = document.getElementById("src");
    const outImg = document.getElementById("out");
    const status = document.getElementById("status");
    const dl = document.getElementById("dl");
    let blobUrl;

    fileEl.addEventListener("change", () => {
      const f = fileEl.files?.[0];
      if (!f) return;
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(f);
      srcImg.src = blobUrl;
      outImg.removeAttribute("src");
      dl.hidden = true;
      runBtn.disabled = false;
      status.textContent = "Ready.";
    });

    runBtn.addEventListener("click", async () => {
      const f = fileEl.files?.[0];
      if (!f) return;
      runBtn.disabled = true;
      status.textContent = "Loading model (first run downloads ~40MB)…";
      try {
        const result = await removeBackground(f, {
          model: "small",
          progress: (key, current, total) => {
            if (!total) return;
            status.textContent = `${key}: ${Math.round((current / total) * 100)}%`;
          },
        });
        const url = URL.createObjectURL(result);
        outImg.src = url;
        dl.href = url;
        dl.download = (f.name.replace(/\.[^.]+$/, "") || "image") + "-nobg.png";
        dl.hidden = false;
        status.textContent = "Done. Private — never uploaded.";
      } catch (err) {
        status.textContent = "Failed: " + (err?.message || err);
      } finally {
        runBtn.disabled = !fileEl.files?.[0];
      }
    });
  </script>
</body>
</html>
